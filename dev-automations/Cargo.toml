[package]
name = "dev-automations"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["cargo"] }
eframe = "0.35.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = {path = "../shared", features = ["fare-data"]}
toml = "1.1.5"
